services:
  postgres:
    image: postgres:16-alpine
    container_name: minidrive-postgres
    environment:
      POSTGRES_USER: minidrive
      POSTGRES_PASSWORD: minidrive
      POSTGRES_DB: minidrive
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U minidrive"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minidrive-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # MinIO webconsole
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb local/minidrive-chunks --ignore-existing
        echo 'Bucket minidrive-chunks ready'

volumes:
  pgdata:
  minio-data: